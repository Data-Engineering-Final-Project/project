services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    # Found running with no restart policy at all (defaults to "no") after a
    # real incident: Docker's OOM killer took it out (docker inspect showed
    # OOMKilled: true, RestartPolicy: no) and it simply stayed dead -- for
    # 13+ days, silently, because nothing else in the stack depends on Kafka
    # failing loudly. The producers and the ensure_streaming_running Airflow
    # task both already retry/restart correctly on their own side, but none
    # of that helps when the broker they're retrying against is gone; they
    # just kept failing to reconnect every cycle. This is the same class of
    # bug already fixed once for dashboard-api's JVM death -- a stateful
    # dependency needs its own restart policy, not just resilience in the
    # things that depend on it.
    restart: unless-stopped
    networks:
      - data_pipeline_network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    networks:
      - data_pipeline_network
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  market-events-producer:
    build:
      context: ..
      dockerfile: streaming/Dockerfile
    container_name: market-events-producer
    depends_on:
      - kafka
    networks:
      - data_pipeline_network
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../data:/app/data
    restart: on-failure
    command: ["python", "streaming/producers/market_events_producer.py"]

  analyst-ratings-producer:
    build:
      context: ..
      dockerfile: streaming/Dockerfile
    container_name: analyst-ratings-producer
    depends_on:
      - kafka
    networks:
      - data_pipeline_network
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../data:/app/data
    restart: on-failure
    command: ["python", "streaming/producers/analyst_ratings_producer.py"]

volumes:
  kafka-data:

networks:
  data_pipeline_network:
    external: true
