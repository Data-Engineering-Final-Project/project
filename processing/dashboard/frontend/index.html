<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volumetric Anomaly Detection — Live Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Volumetric Anomaly Detection</h1>
    <div class="live-indicator"><span class="dot"></span> LIVE</div>
  </header>

  <div id="ticker-strip" class="ticker-strip"></div>

  <main class="grid">
    <section class="panel" id="panel-heatmap">
      <h2>Sector Volume Analysis</h2>
      <div id="heatmap" class="heatmap"></div>
    </section>

    <section class="panel" id="panel-spikes">
      <h2>Top Volume Spikes</h2>
      <table id="spikes-table">
        <thead>
          <tr><th>Ticker</th><th>Sector</th><th>Volume Ratio</th><th>RSI</th><th>Outcome</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel" id="panel-predictor">
      <h2>ML Price Predictor</h2>
      <div class="predictor-controls">
        <select id="ticker-select"></select>
      </div>
      <div id="predictor-result" class="predictor-result">Select a ticker</div>
    </section>

    <section class="panel" id="panel-timeline">
      <h2>Late Arrivals Timeline</h2>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
