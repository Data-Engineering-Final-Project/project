services:
  spark-iceberg:
    build: .
    container_name: spark-iceberg
    networks:
      - data_pipeline_network
    depends_on:
      - rest
      - minio
    volumes:
      # A named volume, NOT a bind mount to ./warehouse, and that distinction
      # is load bearing. This directory holds Spark's streaming checkpoints,
      # the trained model pickle, and job logs -- runtime state, not source.
      # When the repo lives on cloud-synced storage (OneDrive Files
      # On-Demand, iCloud Drive, Dropbox Smart Sync), the sync client
      # eventually evicts the contents of files nobody has touched recently
      # and leaves a metadata-only placeholder. `ls -la` still shows the
      # original size, so everything looks fine; the giveaway is 0 allocated
      # blocks. A read from the host transparently re-downloads the file, but
      # a read from inside a container through the bind mount cannot trigger
      # that -- it just fails with "Resource deadlock avoided" (errno 35).
      # This bit twice: first it took out the ML panel (unreadable model
      # pickle), then it stopped the Kafka to bronze streaming job from
      # starting at all, with 476 checkpoint files evicted. Docker's own
      # volume storage is outside any sync client's reach.
      #
      # Nothing here needs to be visible from the host. To read the streaming
      # log: docker exec spark-iceberg tail -f /home/iceberg/warehouse/bronze_ingest_streams.log
      - warehouse-store:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
      - ./jobs:/home/iceberg/jobs
      - ../data:/home/iceberg/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: supersecret
      AWS_REGION: us-east-1
    ports:
      - "8888:8888"
    # Same root cause as dashboard-api below, found later: the base image's
    # entrypoint.sh unconditionally starts a full standalone Spark
    # master/worker/history-server/thrift-server that nothing here actually
    # uses -- every job runs in local mode via `docker exec ... spark-submit`,
    # nothing points at spark://spark-iceberg:7077. That's ~1GB+ of pure
    # waste, running the whole time, on top of the same waste in
    # dashboard-api -- the real reason the streaming consumer (also running
    # in this container) kept getting OOM-killed throughout a long session,
    # not anything wrong with the consumer itself. Skips straight to
    # /bin/notebook (still keeps Jupyter, unlike dashboard-api which needs
    # neither notebook nor the cluster services).
    entrypoint: ["/bin/notebook"]

  dashboard-api:
    build: .
    container_name: dashboard-api
    networks:
      - data_pipeline_network
    depends_on:
      - rest
      - minio
    volumes:
      # Same named volume spark-iceberg writes the trained model into (see
      # the comment there for why this isn't a bind mount). Read side only.
      - warehouse-store:/home/iceberg/warehouse
      - ./dashboard:/home/iceberg/dashboard
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: supersecret
      AWS_REGION: us-east-1
      # Caps the local-mode Spark driver's heap. Left unset it defaults to
      # 1g of heap but nothing bounds total RSS, and this process was found
      # at 2.23GB after two weeks of polling every 5s -- enough to push the
      # whole stack (Kafka, Airflow, MinIO, two Spark containers) past
      # Docker Desktop's ~7.75GB and get the JVM killed. It kept recovering
      # via the os._exit self-heal below, but 44 container restarts and 168
      # JVM deaths later that's a crash loop, not resilience: each cycle is
      # ~30s of the dashboard being unreachable. These queries are small
      # aggregates over pruned Iceberg scans; 512m is plenty.
      SPARK_DRIVER_MEMORY: 512m
    ports:
      - "8000:8000"
    # api.py deliberately exits (os._exit) if it detects its SparkSession's
    # JVM died -- restarting the whole process for a fresh session is more
    # reliable than trying to rebuild a PySpark session in-process. This
    # policy is what actually completes that recovery.
    restart: unless-stopped
    # Bypass the base image's entrypoint.sh entirely -- it unconditionally
    # starts a full standalone Spark master/worker/history-server/thrift-server
    # before running anything else, ~1GB+ of memory this lightweight query API
    # doesn't need (it only ever runs local-mode spark.sql() calls). Running
    # that redundant baseline alongside spark-iceberg's own copy is what
    # pushed total memory usage into OOM-kill territory under Docker Desktop's
    # default resource limits -- verified by watching `docker stats` and
    # correlating with an exit-137 kill on a concurrent Airflow task.
    entrypoint: ["python3", "/home/iceberg/dashboard/api.py"]

  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      - data_pipeline_network
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: supersecret
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/wh/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  minio:
    image: minio/minio
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecret
    networks:
      data_pipeline_network:
        aliases:
          - warehouse.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mc:
    image: minio/mc
    container_name: mc
    depends_on:
      - minio
    networks:
      - data_pipeline_network
    entrypoint: >
      /bin/sh -c "
        until mc alias set minio http://minio:9000 admin supersecret; do sleep 1; done;
        mc mb minio/warehouse --ignore-existing;
        tail -f /dev/null
      "

volumes:
  minio-data:
  warehouse-store:

networks:
  data_pipeline_network:
    external: true
